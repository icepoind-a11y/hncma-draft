<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HNCMA — Draft</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body class="mode-en">

<div class="draft-bar" role="note"><span data-i18n="draftBar"></span></div>

<header class="site-header">
  <div class="wrap header-top">
    <a class="brand" href="#home" aria-label="HNCMA home">
      <img src="assets/mark.svg" alt="" width="40" height="40">
      <span class="brand-text">
        <strong>HNCMA</strong>
        <small data-i18n="brandSub"></small>
      </span>
    </a>
    <div class="header-tools">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
        <button type="button" data-lang="both" aria-pressed="false">EN + 中</button>
      </div>
      <a class="btn btn-small btn-gold hide-sm" href="#membership" data-i18n="joinCta"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only" data-i18n="menu"></span><span class="bars" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <nav class="site-nav" id="site-nav" aria-label="Main">
    <div class="wrap">
      <a href="#home" data-nav="home" data-i18n="navHome"></a>
      <a href="#about" data-nav="about" data-i18n="navAbout"></a>
      <a href="#fire-needle" data-nav="fire-needle" data-i18n="navFire"></a>
      <a href="#training" data-nav="training" data-i18n="navTraining"></a>
      <a href="#membership" data-nav="membership" data-i18n="navMembership"></a>
      <a href="#contact" data-nav="contact" data-i18n="navContact"></a>
    </div>
  </nav>
</header>

<main id="main">

<!-- HOME -->
<section class="page" data-page="home">
  <div class="hero">
    <div class="hero-art" aria-hidden="true"></div>
    <div class="wrap hero-inner">
      <p class="eyebrow light" data-i18n="heroEyebrow"></p>
      <h1 class="display" data-i18n="heroTitle"></h1>
      <p class="hero-lede" data-i18n="heroLede"></p>
      <div class="hero-ctas">
        <a class="btn btn-gold" href="#about" data-i18n="heroCta1"></a>
        <a class="btn btn-ghost" href="#fire-needle" data-i18n="heroCta2"></a>
      </div>
    </div>
  </div>

  <div class="wrap section reveal">
    <div class="split">
      <h2 class="display-2" data-i18n="introTitle"></h2>
      <div>
        <p class="lead" data-i18n="introBody"></p>
        <p class="muted" data-i18n="introNote"></p>
      </div>
    </div>
  </div>

  <div class="wrap section reveal">
    <h2 class="display-2" data-i18n="exploreTitle"></h2>
    <div class="tiles">
      <a class="tile" href="#about"><span class="orb orb-1"></span><span class="tile-title" data-i18n="navAbout"></span><span class="arrow"></span></a>
      <a class="tile" href="#fire-needle"><span class="orb orb-2"></span><span class="tile-title" data-i18n="tileFire"></span><span class="arrow"></span></a>
      <a class="tile" href="#training"><span class="orb orb-3"></span><span class="tile-title" data-i18n="navTraining"></span><span class="arrow"></span></a>
      <a class="tile" href="#membership"><span class="orb orb-4"></span><span class="tile-title" data-i18n="navMembership"></span><span class="arrow"></span></a>
      <a class="tile" href="#contact"><span class="orb orb-5"></span><span class="tile-title" data-i18n="navContact"></span><span class="arrow"></span></a>
    </div>
  </div>

  <div class="band reveal">
    <div class="wrap section">
      <p class="eyebrow" data-i18n="pillarsEyebrow"></p>
      <div class="pillars">
        <div><span class="num">01</span><h3 data-i18n="p1t"></h3><p data-i18n="p1b"></p></div>
        <div><span class="num">02</span><h3 data-i18n="p2t"></h3><p data-i18n="p2b"></p></div>
        <div><span class="num">03</span><h3 data-i18n="p3t"></h3><p data-i18n="p3b"></p></div>
      </div>
    </div>
  </div>

  <div class="wrap section reveal">
    <div class="split">
      <h2 class="display-2" data-i18n="joinTitle"></h2>
      <div>
        <p class="lead" data-i18n="joinBody"></p>
        <a class="btn btn-ink" href="#membership" data-i18n="joinCta2"></a>
      </div>
    </div>
  </div>
</section>

<!-- ABOUT -->
<section class="page" data-page="about" hidden>
  <header class="page-head"><div class="wrap">
    <p class="eyebrow" data-i18n="navAbout"></p>
    <h1 class="display" data-i18n="aboutTitle"></h1>
    <p class="lead" data-i18n="aboutLede"></p>
  </div></header>
  <div class="wrap section reveal">
    <div class="split">
      <h2 class="display-3" data-i18n="factsTitle"></h2>
      <dl class="facts">
        <dt data-i18n="fBasedK"></dt><dd data-i18n="fBasedV"></dd>
        <dt data-i18n="fNameK"></dt><dd data-i18n="fNameV"></dd>
        <dt data-i18n="fStatusK"></dt><dd data-i18n="fStatusV"></dd>
        <dt data-i18n="fPeopleK"></dt><dd data-i18n="fPeopleV"></dd>
        <dt data-i18n="fWhoK"></dt><dd data-i18n="fWhoV"></dd>
      </dl>
    </div>
  </div>
  <div class="wrap section reveal">
    <div class="split">
      <h2 class="display-3" data-i18n="futureTitle"></h2>
      <div><p data-i18n="futureBody"></p></div>
    </div>
  </div>
</section>

<!-- FIRE NEEDLE -->
<section class="page" data-page="fire-needle" hidden>
  <header class="page-head"><div class="wrap">
    <p class="eyebrow" data-i18n="navFire"></p>
    <h1 class="display" data-i18n="fireTitle"></h1>
    <p class="lead" data-i18n="fireLede"></p>
  </div></header>
  <div class="wrap section reveal">
    <div class="split">
      <h2 class="display-3" data-i18n="histTitle"></h2>
      <div><p data-i18n="histBody"></p><p class="muted small" data-i18n="histNote"></p></div>
    </div>
  </div>
  <div class="band reveal">
    <div class="wrap section">
      <div class="split">
        <h2 class="display-3" data-i18n="theoryTitle"></h2>
        <div>
          <p data-i18n="theoryIntro"></p>
          <ol class="terms">
            <li data-i18n="t1"></li><li data-i18n="t2"></li><li data-i18n="t3"></li><li data-i18n="t4"></li>
            <li data-i18n="t5"></li><li data-i18n="t6"></li><li data-i18n="t7"></li>
          </ol>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap section reveal">
    <div class="split">
      <h2 class="display-3" data-i18n="safetyTitle"></h2>
      <div><p data-i18n="safetyBody"></p><p data-i18n="safetyAdvice"></p></div>
    </div>
  </div>
  <div class="wrap section reveal">
    <aside class="review-box"><h3 data-i18n="reviewTitle"></h3><p data-i18n="reviewBody"></p></aside>
  </div>
</section>

<!-- TRAINING -->
<section class="page" data-page="training" hidden>
  <header class="page-head"><div class="wrap">
    <p class="eyebrow" data-i18n="navTraining"></p>
    <h1 class="display" data-i18n="trainTitle"></h1>
    <p class="lead" data-i18n="trainLede"></p>
  </div></header>
  <div class="wrap section reveal">
    <div class="cards">
      <article class="card"><span class="status" data-i18n="planned"></span><h3 data-i18n="c1t"></h3><p data-i18n="c1b"></p></article>
      <article class="card"><span class="status" data-i18n="planned"></span><h3 data-i18n="c2t"></h3><p data-i18n="c2b"></p></article>
      <article class="card"><span class="status" data-i18n="planned"></span><h3 data-i18n="c3t"></h3><p data-i18n="c3b"></p></article>
    </div>
  </div>
  <div class="wrap section reveal">
    <div class="empty">
      <h2 class="display-3" data-i18n="eventsTitle"></h2>
      <p data-i18n="noEvents"></p>
      <button class="btn btn-ink" type="button" data-draft="interest" data-i18n="interestBtn"></button>
    </div>
  </div>
</section>

<!-- MEMBERSHIP -->
<section class="page" data-page="membership" hidden>
  <header class="page-head"><div class="wrap">
    <p class="eyebrow" data-i18n="navMembership"></p>
    <h1 class="display" data-i18n="memTitle"></h1>
    <p class="lead" data-i18n="memLede"></p>
  </div></header>
  <div class="wrap section reveal">
    <div class="two-col">
      <div class="panel">
        <h2 class="display-3" data-i18n="eligTitle"></h2>
        <ul class="ticks"><li data-i18n="elig1"></li><li data-i18n="elig2"></li></ul>
        <p class="muted small" data-i18n="eligNote"></p>
      </div>
      <div class="panel">
        <h2 class="display-3" data-i18n="benTitle"></h2>
        <ul class="ticks"><li data-i18n="ben1"></li><li data-i18n="ben2"></li><li data-i18n="ben3"></li><li data-i18n="ben4"></li></ul>
        <p class="muted small" data-i18n="benNote"></p>
      </div>
    </div>
  </div>
  <div class="wrap section reveal">
    <div class="empty">
      <h2 class="display-3" data-i18n="feesTitle"></h2>
      <p data-i18n="feesBody"></p>
      <button class="btn btn-gold" type="button" data-draft="apply" data-i18n="applyBtn"></button>
    </div>
  </div>
</section>

<!-- CONTACT -->
<section class="page" data-page="contact" hidden>
  <header class="page-head"><div class="wrap">
    <p class="eyebrow" data-i18n="navContact"></p>
    <h1 class="display" data-i18n="contactTitle"></h1>
    <p class="lead" data-i18n="contactLede"></p>
  </div></header>
  <div class="wrap section reveal">
    <div class="two-col">
      <dl class="facts">
        <dt data-i18n="cEmailK"></dt><dd data-i18n="tbcOnly"></dd>
        <dt data-i18n="cPhoneK"></dt><dd data-i18n="tbcOnly"></dd>
        <dt data-i18n="cAddrK"></dt><dd data-i18n="cAddrV"></dd>
        <dt data-i18n="cWebK"></dt><dd data-i18n="cWebV"></dd>
      </dl>
      <form class="form" id="contact-form" novalidate>
        <p class="form-flag" data-i18n="formFlag"></p>
        <label><span data-i18n="fName"></span><input name="name" autocomplete="off" required></label>
        <label><span data-i18n="fEmail"></span><input name="email" type="email" autocomplete="off" required></label>
        <label><span data-i18n="fRole"></span>
          <select name="role">
            <option value="practitioner" data-i18n="r1"></option>
            <option value="student" data-i18n="r2"></option>
            <option value="public" data-i18n="r3"></option>
            <option value="other" data-i18n="r4"></option>
          </select>
        </label>
        <label><span data-i18n="fMsg"></span><textarea name="message" rows="4" required></textarea></label>
        <button class="btn btn-ink" type="submit" data-i18n="fSubmit"></button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>

</main>

<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <a class="brand brand-footer" href="#home"><img src="assets/mark.svg" alt="" width="36" height="36"><strong>HNCMA</strong></a>
      <p data-i18n="footAbout"></p>
    </div>
    <nav aria-label="Footer">
      <a href="#about" data-i18n="navAbout"></a>
      <a href="#fire-needle" data-i18n="navFire"></a>
      <a href="#training" data-i18n="navTraining"></a>
      <a href="#membership" data-i18n="navMembership"></a>
      <a href="#contact" data-i18n="navContact"></a>
    </nav>
    <div class="small">
      <p data-i18n="footDisclaimer"></p>
      <p data-i18n="footPrivacy"></p>
    </div>
  </div>
  <div class="wrap footer-base small"><span data-i18n="footCopy"></span></div>
</footer>

<dialog class="modal" id="draft-modal">
  <h2 class="display-3" data-i18n="modalTitle"></h2>
  <p data-i18n="modalBody"></p>
  <form method="dialog"><button class="btn btn-ink" data-i18n="modalClose"></button></form>
</dialog>

<script src="app.js"></script>
</body>
</html>
